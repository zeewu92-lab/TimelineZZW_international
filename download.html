<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時光線 － 下載</title>
<meta name="description" content="時光線 App 下載頁">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F2F3F6;
    --ink-soft: rgba(242,243,246,0.55);
    --card-bg: #1D2029;
    --card-border: #2B2F3A;
    --input-bg: #232733;
    --page-bg: #121419;
    --accent: #6C7BE0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
    /* 呼應圖示的深夜星空感：底色深藍 + 兩處柔光暈染，疊上一層極細的雜訊點模擬星塵 */
    background-image:
      radial-gradient(circle at 22% 18%, rgba(255,209,140,0.10), transparent 40%),
      radial-gradient(circle at 78% 72%, rgba(108,123,224,0.16), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(108,123,224,0.10), transparent 50%);
    background-color: var(--page-bg);
  }

  /* 極細星點雜訊層，疊加在背景漸層之上，不影響版面互動 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      radial-gradient(1px 1px at 12% 24%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(1px 1px at 32% 62%, rgba(255,255,255,0.35), transparent 100%),
      radial-gradient(1.5px 1.5px at 68% 14%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1px 1px at 84% 46%, rgba(255,255,255,0.3), transparent 100%),
      radial-gradient(1px 1px at 46% 84%, rgba(255,255,255,0.3), transparent 100%),
      radial-gradient(1.5px 1.5px at 90% 82%, rgba(255,255,255,0.35), transparent 100%),
      radial-gradient(1px 1px at 6% 78%, rgba(255,255,255,0.25), transparent 100%);
    background-repeat: no-repeat;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.3);
    padding: 40px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .icon {
    width: 112px;
    height: 112px;
    border-radius: 26px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    margin-bottom: 20px;
  }

  .app-name {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .app-tagline {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 28px;
    line-height: 1.6;
  }

  .platform-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .platform-row svg { flex-shrink: 0; }

  .download-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 20px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    cursor: not-allowed;
    background: var(--card-border);
    color: var(--ink-soft);
    transition: opacity 0.2s ease;
  }

  /* 之後 APK 準備好後，把 .download-btn 換成 <a href="APK網址"> 並套用這個 class 即可上線 */
  .download-btn.is-live {
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 10px 24px rgba(108,123,224,0.35);
  }
  .download-btn.is-live:active { opacity: 0.85; }

  .note {
    margin: 16px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--card-border);
    margin: 26px 0 20px;
  }

  .version {
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="icon" src="icon-512.png" alt="時光線 App 圖示">
    <h1 class="app-name">時光線</h1>
    <p class="app-tagline">把重要的日子，串成一條看得見的時間軸。</p>

    <div class="platform-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.341a1.09 1.09 0 1 1 0-2.18 1.09 1.09 0 0 1 0 2.18Zm-11.046 0a1.09 1.09 0 1 1 0-2.18 1.09 1.09 0 0 1 0 2.18Zm11.404-6.02.002-.006 2.02-3.5a.416.416 0 0 0-.152-.567.416.416 0 0 0-.567.152l-2.046 3.543a11.86 11.86 0 0 0-9.276 0L5.816 5.4a.416.416 0 0 0-.567-.152.416.416 0 0 0-.152.567l2.02 3.5.002.006C3.94 11.166 1.756 14.407 1.5 18.2h21c-.256-3.793-2.44-7.034-5.619-8.879Z"/></svg>
      Android APK
    </div>

    <!-- 先佔位，APK 檔案連結準備好之後，把 button 換成 <a href="真正的 APK 網址" class="download-btn is-live" download> -->
    <button class="download-btn" disabled>
      敬請期待
    </button>
    <p class="note">Android APK 下載連結準備中，上線後會直接開放下載。</p>

    <div class="divider"></div>
    <span class="version">TIMEZZW.TOP</span>
  </div>

</body>
</html>
