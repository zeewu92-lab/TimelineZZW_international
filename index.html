<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.75, minimum-scale=0.75, maximum-scale=2.0, viewport-fit=cover" />
    <title>時光線</title>

    <!-- PWA：讓瀏覽器可以把這個網頁「安裝」到手機主畫面，體驗接近原生 App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS 對 PWA 的支援比較陽春，額外補上這幾個 meta 讓「加入主畫面」後的體驗更像原生 App
         （全螢幕、狀態列樣式），Android／桌面瀏覽器則主要靠上面的 manifest.json 生效 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="時光線" />

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 新增地標視窗裡，切換「關懷模式」時圖示／顏色整組替換的淡入動畫 */
      @keyframes picker-fade-swap-in {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .picker-fade-swap { animation: picker-fade-swap-in 0.25s ease; }
      
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
