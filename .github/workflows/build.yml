name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例如 v1.0.27),務必是從未用過的新版號'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Clean and Recreate Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "top.timezzw.app",
            "appName": "時光線",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android

          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Generate app icons
        run: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png || echo "Icon not found, skipping."
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync assets
        run: npx cap sync

      - name: Fix Kotlin conflict
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Verify Keystore (store password)
        run: |
          keytool -list -v -keystore android/app/release-key.jks \
            -storepass "${{ secrets.STORE_PASS }}"

      - name: Verify Keystore (key password)
        run: |
          keytool -list -v -keystore android/app/release-key.jks \
            -storepass "${{ secrets.STORE_PASS }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASS }}"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASS }}

      - name: Upload to Release (as draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
