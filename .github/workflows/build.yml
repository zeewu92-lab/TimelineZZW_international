name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Clean and Recreate Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          # 先自動初始化設定檔，補上 App 名稱與 ID
          npx cap init "時光線" "top.timezzw.app" --web-dir=dist --yes
          # 接著再安全地加入 android 平台
          npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png || echo "Icon not found, skipping."
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync assets
        run: npx cap sync

      - name: Fix Kotlin conflict
        run: |
          echo '
          android {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }' >> android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASS }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
